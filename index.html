<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="theme-color" content="#1a1208" />
    <title>三国保卫战 · 烽火三国塔防</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%231a1208' width='64' height='64' rx='10'/%3E%3Cpath fill='%23c9a227' d='M18 48 V22 l14-10 14 10 v26 H18z'/%3E%3Ccircle fill='%238b1e1e' cx='32' cy='30' r='6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="loading" class="screen">
        <div class="wood-plaque loading-bar">
          <b id="loading-text">正在点兵……</b>
          <i class="load-track"><i id="load-fill" class="load-fill"></i></i>
        </div>
      </div>

      <div id="rotate" class="rotate-prompt hidden">
        <div class="rotate-card wood-plaque">
          <b>请横过来游玩</b>
          <p>横屏更好操作。若无法自动横置，也可直接进入。</p>
          <button id="btn-enter" class="horn-btn" type="button"><b>进入游戏</b></button>
        </div>
      </div>

      <div id="ui" class="hidden">
        <section id="menu" class="screen campaign">
          <div class="campaign-bleed" aria-hidden="true">
            <img id="campaign-board" alt="" />
          </div>
          <header class="title-hang">
            <img id="title-plaque" class="title-plaque" alt="" />
            <div class="title-copy">
              <h1 class="title">三国保卫战</h1>
              <p class="subtitle">烽火三国塔防</p>
            </div>
          </header>
          <p class="blurb">选一处关隘布防。敌军八波来犯，末波乃吕布幻影。</p>
          <div id="map-list" class="pass-row"></div>
        </section>

        <section id="hud" class="hud hidden">
          <div class="hud-tl">
            <button id="btn-menu" class="icon-btn" type="button" title="回选关">
              <img id="ico-back" alt="返" />
            </button>
            <div class="plaque res-plaque">
              <span class="res"><img id="ico-heart" alt="" /><b id="stat-lives">20/20</b></span>
              <span class="res"><img id="ico-coin" alt="" /><b id="stat-gold">0</b></span>
            </div>
          </div>

          <div class="wave-flag">
            <small id="stat-wave-name">待发</small>
            <b id="stat-wave">0/8</b>
          </div>

          <div id="toast" class="toast hidden"></div>
          <div id="banner" class="banner hidden"></div>
          <div id="wheel" class="kr-wheel hidden"></div>
          <div id="floaters" class="floaters"></div>
          <button id="call-flag" class="call-flag hidden" type="button" title="出兵">
            <img id="ico-call" alt="" />
          </button>

          <div id="hero-bar" class="hero-bar"></div>

          <div class="hud-br">
            <button id="btn-wave" class="horn-btn" type="button">
              <img id="ico-horn" alt="" />
              <b id="btn-wave-label">出兵</b>
            </button>
            <button id="btn-speed" class="icon-btn" type="button" title="加速">
              <img id="ico-speed" alt="×1" />
            </button>
            <button id="btn-pause" class="icon-btn" type="button" title="歇兵">
              <img id="ico-pause" alt="停" />
            </button>
          </div>
        </section>

        <section id="pause" class="screen overlay hidden">
          <div class="pause-board wood-plaque">
            <h2>歇兵</h2>
            <p>旌旗暂歇，重整再战。</p>
            <div class="overlay-actions col">
              <button id="btn-resume" class="horn-btn" type="button"><b>继续</b></button>
              <button id="btn-restart" class="iron-btn wide" type="button">重开此关</button>
              <button id="btn-quit" class="iron-btn wide" type="button">回选关</button>
            </div>
          </div>
        </section>

        <section id="overlay" class="screen overlay hidden">
          <div class="end-board wood-plaque">
            <h2 id="overlay-title">胜负已分</h2>
            <div id="star-row" class="star-row"></div>
            <p id="overlay-text"></p>
            <ul id="end-stats" class="end-stats"></ul>
            <div class="overlay-actions">
              <button id="btn-retry" class="horn-btn" type="button"><b>再守此关</b></button>
              <button id="btn-home" class="iron-btn wide" type="button">选关</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
